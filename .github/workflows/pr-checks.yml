# Runs on every PR into main (and on main itself). Branch protection requires
# all three jobs to pass before a PR can be merged, and merging is what
# deploys (Vercel for the frontend, the HF Space for the backend).
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: deploy/hf-space/requirements-server.txt
      - name: Install dependencies
        run: pip install -r deploy/hf-space/requirements-server.txt pytest==9.2.0 httpx==0.28.1
      - name: Run tests (agent is stubbed; no OpenAI calls)
        run: pytest -q tests

  backend-docker:
    name: Backend Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stub data files
        # parts.db and the Chroma index are gitignored and only live on the
        # Space; empty placeholders let the Dockerfile's COPY steps run.
        run: mkdir -p data/chroma && touch data/parts.db
      - name: Build image
        run: docker build -f deploy/hf-space/Dockerfile -t partselect-api:ci .

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (CI=true turns lint warnings into errors)
        run: npm run build
        env:
          CI: true
